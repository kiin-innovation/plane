version: "3.8"

# DNS collision avoidance for multi-stack Dokploy:
# Internal services renamed with `plane-*` prefix (unique cluster-wide) and
# `links:` on the `proxy` service creates /etc/hosts entries (`<plane-web-IP>
# web`, etc.) — /etc/hosts takes absolute priority over DNS, so the Caddy
# inside plane-proxy (which has `reverse_proxy web:3000`/`api:8000`
# hardcoded) resolves straight to our containers, ignoring any `web`/`api`
# containers from other stacks on the shared Dokploy network.
#
# Configuration: copy .env.example to .env and adjust values there.

x-db-env: &db-env
  PGHOST: ${PGHOST}
  PGDATABASE: ${PGDATABASE}
  POSTGRES_USER: ${POSTGRES_USER}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  POSTGRES_DB: ${POSTGRES_DB}
  POSTGRES_PORT: ${POSTGRES_PORT}
  PGDATA: ${PGDATA}

x-redis-env: &redis-env
  REDIS_HOST: ${REDIS_HOST}
  REDIS_PORT: ${REDIS_PORT}
  REDIS_URL: ${REDIS_URL}

x-minio-env: &minio-env
  MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID}
  MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY}

x-aws-s3-env: &aws-s3-env
  AWS_REGION: ${AWS_REGION}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
  AWS_S3_ENDPOINT_URL: ${AWS_S3_ENDPOINT_URL}
  AWS_S3_BUCKET_NAME: ${AWS_S3_BUCKET_NAME}

x-proxy-env: &proxy-env
  APP_DOMAIN: ${APP_DOMAIN}
  FILE_SIZE_LIMIT: ${FILE_SIZE_LIMIT}
  BUCKET_NAME: ${AWS_S3_BUCKET_NAME}
  LISTEN_HTTP_PORT: ${LISTEN_HTTP_PORT}
  # Caddy proxy: listen address (no upstream default in Caddyfile -> must be set,
  # else the `{$SITE_ADDRESS} { ... }` block is keyless and Caddy aborts).
  SITE_ADDRESS: ${SITE_ADDRESS}
  # trusted_proxies decides which peers may set X-Forwarded-For/X-Real-IP. Dokploy's
  # Traefik upstream always lives on Dokploy's private network, so trust only private
  # ranges (Caddy built-in) instead of 0.0.0.0/0 to prevent client-IP spoofing if the
  # proxy is ever exposed directly. Override with your real upstream CIDR if needed.
  TRUSTED_PROXIES: ${TRUSTED_PROXIES}

x-mq-env: &mq-env
  RABBITMQ_HOST: ${RABBITMQ_HOST}
  RABBITMQ_PORT: ${RABBITMQ_PORT}
  RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
  RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
  RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST}
  RABBITMQ_VHOST: ${RABBITMQ_VHOST}

x-live-env: &live-env
  API_BASE_URL: ${API_BASE_URL}
  LIVE_SERVER_SECRET_KEY: ${LIVE_SERVER_SECRET_KEY}

x-smtp-env: &smtp-env
  SKIP_ENV_VAR: ${SKIP_ENV_VAR}
  ENABLE_SMTP: ${ENABLE_SMTP}
  EMAIL_HOST: ${EMAIL_HOST}
  EMAIL_PORT: ${EMAIL_PORT}
  EMAIL_HOST_USER: ${EMAIL_HOST_USER}
  EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD}
  EMAIL_FROM: ${EMAIL_FROM}
  EMAIL_USE_TLS: ${EMAIL_USE_TLS}
  EMAIL_USE_SSL: ${EMAIL_USE_SSL}

x-app-env: &app-env
  <<: *smtp-env
  WEB_URL: ${WEB_URL}
  DEBUG: ${DEBUG}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
  GUNICORN_WORKERS: ${GUNICORN_WORKERS}
  USE_MINIO: ${USE_MINIO}
  DATABASE_URL: ${DATABASE_URL}
  SECRET_KEY: ${SECRET_KEY}
  AMQP_URL: ${AMQP_URL}
  API_KEY_RATE_LIMIT: ${API_KEY_RATE_LIMIT}
  MINIO_ENDPOINT_SSL: ${MINIO_ENDPOINT_SSL}
  LIVE_SERVER_SECRET_KEY: ${LIVE_SERVER_SECRET_KEY}
  WEBHOOK_ALLOWED_IPS: ${WEBHOOK_ALLOWED_IPS}
  WEBHOOK_ALLOWED_HOSTS: ${WEBHOOK_ALLOWED_HOSTS}

services:
  plane-web:
    image: makeplane/plane-frontend:${APP_RELEASE}
    restart: unless-stopped
    depends_on:
      plane-api:
        condition: service_started
      plane-worker:
        condition: service_started

  plane-space:
    image: makeplane/plane-space:${APP_RELEASE}
    restart: unless-stopped
    depends_on:
      plane-api:
        condition: service_started
      plane-worker:
        condition: service_started
      plane-web:
        condition: service_started

  plane-admin:
    image: makeplane/plane-admin:${APP_RELEASE}
    restart: unless-stopped
    depends_on:
      plane-api:
        condition: service_started
      plane-web:
        condition: service_started

  plane-live:
    image: makeplane/plane-live:${APP_RELEASE}
    restart: unless-stopped
    environment:
      <<: [*live-env, *redis-env]
    depends_on:
      plane-api:
        condition: service_started
      plane-web:
        condition: service_started

  plane-api:
    image: makeplane/plane-backend:${APP_RELEASE}
    restart: unless-stopped
    command: ./bin/docker-entrypoint-api.sh
    volumes:
      - logs_api:/code/plane/logs
    environment:
      <<: [*app-env, *db-env, *redis-env, *minio-env, *aws-s3-env, *proxy-env]
    depends_on:
      plane-db:
        condition: service_healthy
      plane-redis:
        condition: service_healthy
      plane-mq:
        condition: service_healthy
      plane-migrator:
        condition: service_completed_successfully
      plane-mailpit:
        condition: service_started

  plane-worker:
    image: makeplane/plane-backend:${APP_RELEASE}
    restart: unless-stopped
    command: ./bin/docker-entrypoint-worker.sh
    volumes:
      - logs_worker:/code/plane/logs
    environment:
      <<: [*app-env, *db-env, *redis-env, *minio-env, *aws-s3-env, *proxy-env]
    depends_on:
      plane-db:
        condition: service_healthy
      plane-redis:
        condition: service_healthy
      plane-mq:
        condition: service_healthy
      plane-migrator:
        condition: service_completed_successfully
      plane-mailpit:
        condition: service_started

  plane-beat-worker:
    image: makeplane/plane-backend:${APP_RELEASE}
    restart: unless-stopped
    command: ./bin/docker-entrypoint-beat.sh
    volumes:
      - logs_beat-worker:/code/plane/logs
    environment:
      <<: [*app-env, *db-env, *redis-env, *minio-env, *aws-s3-env, *proxy-env]
    depends_on:
      plane-db:
        condition: service_healthy
      plane-redis:
        condition: service_healthy
      plane-mq:
        condition: service_healthy
      plane-migrator:
        condition: service_completed_successfully

  plane-migrator:
    image: makeplane/plane-backend:${APP_RELEASE}
    restart: on-failure
    command: ./bin/docker-entrypoint-migrator.sh
    volumes:
      - logs_migrator:/code/plane/logs
    environment:
      <<: [*app-env, *db-env, *redis-env, *minio-env, *aws-s3-env, *proxy-env]
    depends_on:
      plane-db:
        condition: service_healthy
      plane-redis:
        condition: service_healthy

  plane-db:
    image: postgres:17-alpine
    restart: unless-stopped
    command: postgres -c 'max_connections=1000'
    environment:
      <<: *db-env
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Expose Postgres Port on the VPS for remote backups/tools
    ports:
      - "${POSTGRES_EXTERNAL_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  plane-redis:
    image: valkey/valkey:7.2.11-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  plane-mq:
    image: rabbitmq:3.13.6-management-alpine
    restart: unless-stopped
    environment:
      <<: *mq-env
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  plane-minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: server /export --console-address ":9090"
    environment:
      <<: *minio-env
    volumes:
      - uploads:/export

  plane-mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "${MAILPIT_UI_PORT}:8025"
    environment:
      MP_SMTP_BIND_ADDR: ${MP_SMTP_BIND_ADDR}
      MP_UI_BIND_ADDR: ${MP_UI_BIND_ADDR}

  proxy:
    image: makeplane/plane-proxy:${APP_RELEASE}
    restart: unless-stopped
    ports:
      - "${LISTEN_HTTP_PORT}:80"
    environment:
      <<: *proxy-env
    volumes:
      - proxy_config:/config
      - proxy_data:/data
    links:
      - "plane-web:web"
      - "plane-api:api"
      - "plane-space:space"
      - "plane-admin:admin"
      - "plane-live:live"
    depends_on:
      plane-web:
        condition: service_started
      plane-api:
        condition: service_started
      plane-space:
        condition: service_started
      plane-admin:
        condition: service_started
      plane-live:
        condition: service_started

volumes:
  pgdata:
  redisdata:
  uploads:
  rabbitmq_data:
  logs_api:
  logs_worker:
  logs_beat-worker:
  logs_migrator:
  proxy_config:
  proxy_data:
